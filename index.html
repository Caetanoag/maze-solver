<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maze Solver</title>
    <link rel="stylesheet" href="./css/main.css">
</head>
<body>
    <main>
        <h1>Gerador | Resolvedor de labirinto:</h1>
        <form id="varform">
            <label for="colunas">Quantidade de colunas</label>
            <input type="number" id="colunas" min="1" value="20" required>
            <br>
            <br>
            <label for="linhas">Quantidade de Linhas</label>
            <input type="number" id="linhas" min="1" value="20" required>
            <br>
            <br>
            <label for="lado-quadrado">Tamanho do pixel</label>
            <input type="number" id="lado-quadrado" min="1" max="40" value="30" required>
            <br>
            <br>
            <label for="porcentagem">Percentual de novos caminhos (0 a 1)</label>
            <input type="number" id="porcentagem" min="0" max="1" step="0.01" value="0.5" required>
            <br>
            <br>
            <button type="submit">Gerar labirinto</button>
        </form>
    </main>
    <br>
    <canvas></canvas>
    <script type="module" src="js/main.js"></script>
</body>
</html>
